# One-click deploy to Render.com: New > Blueprint > point at this repo.
#
# IMPORTANT: a persistent disk (where the SQLite database lives) requires a paid
# instance — Render's FREE web services do NOT keep a disk, so on the free plan the
# database is WIPED on every deploy/restart and customers' codes would go dead.
# The "starter" plan (~$7/mo) is the minimum that persists data. Use free only for a
# throwaway demo where losing all data on restart is acceptable.
services:
  - type: web
    name: dynaqr
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /data/dynaqr.db
      - key: PUBLIC_URL
        sync: false   # set to your https://<service>.onrender.com URL after first deploy
      - key: STRIPE_SECRET_KEY
        sync: false   # optional — add to enable real billing
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: dynaqr-data
      mountPath: /data
      sizeGB: 1
