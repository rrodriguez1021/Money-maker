# One-command deploy to Fly.io:  fly launch --copy-config --no-deploy && fly deploy
# (Fly gives you a free https URL + a persistent volume.)
app = "dynaqr"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/dynaqr.db"
  # Set your real URL after first deploy:  fly secrets set PUBLIC_URL=https://dynaqr.fly.dev
  # Billing (optional):
  #   fly secrets set STRIPE_SECRET_KEY=sk_live_... STRIPE_PRICE_ID=price_... STRIPE_WEBHOOK_SECRET=whsec_...

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "dynaqr_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
